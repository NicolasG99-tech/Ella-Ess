services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lese_app
      POSTGRES_PASSWORD: lese_app_dev_only
      POSTGRES_DB: lese_app
    ports:
      - '5432:5432'
    volumes:
      - lese_app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lese_app -d lese_app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lese_app_db_data:
